name: Rust
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - if: runner.os == 'macOS'
        run: |
          sh scripts/test-network-notify.sh
          cargo test --locked --no-default-features --features apple-network,apple-coalesce
          cargo build --locked --features network-bench --example network_bench
          python3 scripts/test-network-bench.py --binary target/debug/examples/network_bench
      - if: runner.os == 'macOS'
        run: ./scripts/test-wg.sh
