[package]
name = "interestun"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
description = "A peer-threaded macOS and Windows userspace tunnel"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = ["apple-network-multiple", "apple-coalesce"]
io-metrics = []
io-profile = ["io-metrics"]
apple-network = []
# Public NEPacketTunnelFlow bridge, hosted by the macOS system extension.
apple-packet-tunnel = ["apple-network", "dep:serde_json"]
# Selects the mapped utun backend. Live attachment is gated in utun_ring.rs.
apple-utun-ring = []
# Experimental private Apple SPI. See docs/network-framework-audit.md.
apple-network-multiple = ["apple-network"]
apple-coalesce = []
network-bench = ["apple-network", "dep:serde_json"]

[build-dependencies]
cc = "1"

[dependencies]
anyhow = "1"
boringtun = { git = "https://github.com/jamilbk/boringtun", rev = "ea898e76dc58cd470433bd1efa9b9632ff179129", default-features = false }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
ipnet = "2"
ip_network = "0.4"
ip_network_table = "0.2"
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
crossbeam-queue = "0.3"
rand = "0.10"
serde_json = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
mio = { version = "1", features = ["os-poll", "os-ext", "net"] }
libloading = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[[bench]]
name = "transport"
harness = false

[[bench]]
name = "injection"
harness = false

[[example]]
name = "network_bench"
path = "examples/network_bench/main.rs"
required-features = ["network-bench"]
